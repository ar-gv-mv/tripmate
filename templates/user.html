<!DOCTYPE html>
<html>
<head>
  <title>User profile</title>
</head>

<body>
  <h1>{{user.username}}</h1>

  <p>
    Number of trips: {{trip_count}}
  </p>

  <h2>Trips</h2>

  {%for trip in trips%}
  <p>
    <a href="/trip/{{trip.id}}">
      From {{trip.start_location}} to {{trip.destination}}
    </a>
    <br/>
    Date: {{trip.travel_date}}
  </p>
  <hr/>
  {%endfor%}

  <p>
    <a href="/">Back</a>
  </p>
</body>
</html>
