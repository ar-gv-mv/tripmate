<!DOCTYPE html>
<html>
<head>
  <title>Edit trip</title>
</head>

<body>
  <h1>Edit trip</h1>

  <form action="/edit_trip/{{trip.id}}" method="post">
    <input type="hidden" name="csrf_token" value="{{session.csrf_token}}"/>
    <p>
      <label for="start_location">Starting location:</label><br/>
      <input type="text" name="start_location"
             value="{{trip.start_location}}"
             maxlength="50" required/>
    </p>
    <p>
      <label for="destination">Destination:</label><br/>
      <input type="text" name="destination"
             value="{{trip.destination}}"
             maxlength="50" required/>
    </p>
    <p>
      <label for="travel_date">Date:</label><br/>
      <input type="date" name="travel_date"
             value="{{trip.travel_date}}" min="{{today}}" required/>
    </p>
    <p>
      <label for="seat_count">Number of seats:</label><br/>
      <input type="number" name="seat_count"
             value="{{trip.seat_count}}"
             min="1" max="8" required/>
    </p>
    <p>
      <label for="description">Description:</label><br/>
      <textarea name="description" rows="5" cols="40" maxlength="1000">{{trip.description}}</textarea>
    </p>
    <h2>Travel style</h2>

    {%for option in classifications%}
      {%if option.category == "style"%}
      <p>
        <label>
          <input type="radio" name="style"
                 value="{{option.id}}" required
                 {%if option.id in selected_ids%}checked{%endif%}/>
          {{option.name}}
        </label>
      </p>
      {%endif%}
    {%endfor%}

    <h2>Ride preferences</h2>

    {%for option in classifications%}
      {%if option.category == "preference"%}
      <p>
        <label>
          <input type="checkbox" name="preference"
                 value="{{option.id}}"
                 {%if option.id in selected_ids%}checked{%endif%}/>
          {{option.name}}
        </label>
      </p>
      {%endif%}
    {%endfor%}
    <input type="submit" value="Save changes"/>
  </form>

  <p>
    <a href="/trip/{{trip.id}}">Back</a>
  </p>
</body>
</html>
