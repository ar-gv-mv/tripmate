<!DOCTYPE html>
<html>
<head>
  <title>Search trips</title>
</head>

<body>
  <h1>Search trips</h1>

  <form action="/search" method="post">
    <input type="hidden" name="csrf_token" value="{{session.csrf_token}}"/>
    <p>
      <label for="start_location">From:</label><br/>
      <input type="text" name="start_location"/>
    </p>
    <p>
      <label for="destination">To:</label><br/>
      <input type="text" name="destination"/>
    </p>
    <p>
      <label for="travel_date">Date:</label><br/>
      <input type="date" name="travel_date"/>
    </p>
    <input type="submit" value="Search"/>
  </form>

  {%if results%}
  <h2>Results</h2>

  {%for trip in results%}
  <p>
    <a href="/trip/{{trip.id}}">
      From {{trip.start_location}} to {{trip.destination}}
    </a>
    <br/>
    Date: {{trip.travel_date}}
    <br/>
    Seats: {{trip.seat_count}}
    <br/>
    Created by: {{trip.username}}
  </p>
  <hr/>
  {%endfor%}
  {%endif%}

  <p>
    <a href="/">Back</a>
  </p>
</body>
</html>
